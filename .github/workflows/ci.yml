name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: the `prepare` script runs the build, which we invoke
      # explicitly below. Skipping it here keeps install and build failures
      # distinguishable in the log.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Widget fixture tests
        run: node --test build/widgets.test.js

      - name: Verify the server boots and speaks MCP
        run: node scripts/verify-mcp.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit still leaks

      # The gitleaks-action wrapper derives a <base>^..<head> range, which is an
      # invalid revision when the range includes the root commit (it has no
      # parent) -- that fails the job without ever scanning. Invoking the binary
      # directly scans the entire history unconditionally and is deterministic.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Scan the working tree
        # Catches anything present on disk but not yet committed.
        run: gitleaks dir . --redact --verbose --exit-code 1

      - name: Block credential files from ever being tracked
        run: |
          # Belt-and-braces alongside .gitignore: .gitignore does not protect a
          # file that someone renames or force-adds.
          if git ls-files --error-unmatch .env tokens.json 2>/dev/null; then
            echo "::error::A credential file is tracked in git."
            exit 1
          fi

          # Any tracked file assigning a long literal to a secret-shaped name.
          if git ls-files -z | xargs -0 grep -nEI \
            '(client_secret|clientSecret|refresh_token|access_token|api[_-]?key)[^a-zA-Z0-9]{0,12}[=:][[:space:]]*["\047][A-Za-z0-9_.-]{16,}["\047]' \
            -- ':!*.example' ':!.github/workflows/*' 2>/dev/null; then
            echo "::error::A hardcoded secret literal was found in a tracked file."
            exit 1
          fi

          echo "No tracked credential files or hardcoded secret literals found."
